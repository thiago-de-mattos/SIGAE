{{ formulario.non_field_errors }}
{% for campo in formulario %}
    {% if campo.name == 'prioridade' %}
        {% include "atendimentos/partes/seletor_risco.html" with campo=campo only %}
    {% elif campo.is_hidden %}
        {{ campo.errors }}{{ campo }}
    {% else %}
        <div>{{ campo.as_field_group }}</div>
    {% endif %}
{% endfor %}
